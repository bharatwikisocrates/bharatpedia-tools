<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>File Analyzer - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.file { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.file img.thumb { width: 100%; height: 130px; object-fit: cover; background: var(--surface-2); display: block; }
.file .body { padding: 10px 14px; }
.file .name { font-weight: 600; font-size: 14px; word-break: break-all; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 6px; }
.b-unused { background: var(--danger-soft); color: var(--danger); }
.b-used { background: var(--surface-2); color: var(--ink-soft); }
.meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>File Analyzer</h1>
<p class="sub">Review uploaded files by size, type, and usage. Unused files are candidates for cleanup.</p>
<div class="controls">
<button id="go" onclick="load()">Load recent files</button>
<select id="limit"><option value="30">30 files</option><option value="50" selected>50 files</option><option value="100">100 files</option></select>
<select id="filter" onchange="render()"><option value="all">All files</option><option value="unused">Unused only</option></select>
<select id="sort" onchange="render()"><option value="newest">Newest first</option><option value="largest">Largest first</option><option value="usage">Least used first</option></select>
</div>
<div class="status" id="status"></div>
<div class="stats" id="stats" style="display:none"></div>
<div class="grid" id="grid"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
let files = [];
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
async function load() {
  const btn = document.getElementById("go"), st = document.getElementById("status");
  const limit = document.getElementById("limit").value;
  btn.disabled = true; files = []; st.textContent = "Listing uploaded files...";
  document.getElementById("stats").style.display = "none";
  document.getElementById("grid").innerHTML = "";
  try {
    const d = await api({ action: "query", list: "allimages", aisort: "timestamp", aidir: "older", ailimit: limit, aiprop: "timestamp|user|size|dimensions|mime|url" });
    const list = (d.query && d.query.allimages) || [];
    st.textContent = "Checking usage for " + list.length + " files...";
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      let usage = 0;
      try {
        const u = await api({ action: "query", list: "imageusage", iutitle: f.title, iulimit: 5 });
        usage = (u.query.imageusage || []).length;
      } catch (e) {}
      files.push({ f, usage });
      st.textContent = "Checked " + (i + 1) + " / " + list.length;
    }
    const unused = files.filter(x => x.usage === 0).length;
    const totalSize = files.reduce((s, x) => s + (x.f.size || 0), 0);
    const ss = document.getElementById("stats");
    ss.style.display = "flex";
    ss.innerHTML = `<div class="stat"><b>${files.length}</b><span>Files scanned</span></div><div class="stat"><b>${unused}</b><span>Unused</span></div><div class="stat"><b>${fmtSize(totalSize)}</b><span>Total size</span></div>`;
    st.textContent = "";
    render();
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function render() {
  const grid = document.getElementById("grid");
  const filter = document.getElementById("filter").value, sort = document.getElementById("sort").value;
  let arr = files.slice();
  if (filter === "unused") arr = arr.filter(x => x.usage === 0);
  if (sort === "largest") arr.sort((a, b) => b.f.size - a.f.size);
  else if (sort === "usage") arr.sort((a, b) => a.usage - b.usage);
  else arr.sort((a, b) => new Date(b.f.timestamp) - new Date(a.f.timestamp));
  grid.innerHTML = arr.map(({ f, usage }) => {
    const page = "https://en.bharatpedia.org/wiki/" + encodeURIComponent(f.title.replace(/ /g, "_"));
    const isImg = /^image\//.test(f.mime || "");
    const badge = usage === 0 ? '<span class="badge b-unused">Unused</span>' : `<span class="badge b-used">Used on ${usage} page${usage === 1 ? "" : "s"}</span>`;
    return `<div class="file">${isImg && f.thumburl ? `<a href="${page}" target="_blank" rel="noopener"><img class="thumb" src="${esc(f.thumburl)}" alt="" loading="lazy" /></a>` : ""}<div class="body"><div class="name"><a href="${page}" target="_blank" rel="noopener">${esc(f.title.replace(/^File:/, ""))}</a></div>${badge}<div class="meta">${fmtSize(f.size)}${f.width ? " &middot; " + f.width + "x" + f.height : ""}<br/>${esc(f.user)} &middot; ${fmtDate(f.timestamp)}</div></div></div>`;
  }).join("") || "<p>No files match this filter.</p>";
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtSize(n) { if (!n) return "-"; return n >= 1048576 ? (n/1048576).toFixed(1) + " MB" : n >= 1024 ? (n/1024).toFixed(1) + " KB" : n + " B"; }
function fmtDate(s) { return new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
</script>
</body>
</html>
