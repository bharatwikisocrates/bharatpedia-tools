<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>New Pages Patrol - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --ok: #1e7a3c; --ok-soft: #e2f3e6; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --ok: #5cc47c; --ok-soft: #1d3626; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.results { display: grid; gap: 10px; }
.page { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow); }
.page.patrolled { opacity: .55; }
.page .t { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.patrol { margin-top: 8px; font-size: 13px; }
.patrol label { cursor: pointer; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>New Pages Patrol</h1>
<p class="sub">Review the newest mainspace pages. Patrol marks are saved in this browser only.</p>
<div class="controls">
<button id="go" onclick="load()">Load new pages</button>
<select id="limit"><option value="30">30 pages</option><option value="50" selected>50 pages</option><option value="100">100 pages</option></select>
<label style="font-size:14px;color:var(--ink-soft)"><input type="checkbox" id="hidePatrolled" /> Hide patrolled</label>
</div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
let pages = [];
function patrolledKey(id) { return "npp-patrolled-" + id; }
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
async function load() {
  const btn = document.getElementById("go"), st = document.getElementById("status");
  const limit = document.getElementById("limit").value;
  btn.disabled = true; st.textContent = "Fetching new pages..."; pages = [];
  try {
    const d = await api({ action: "query", list: "recentchanges", rctype: "new", rcnamespace: 0, rcprop: "title|user|timestamp|ids|sizes", rclimit: limit, rcdir: "older" });
    const list = (d.query && d.query.recentchanges) || [];
    st.textContent = "Checking page details...";
    for (let i = 0; i < list.length; i += 20) {
      const batch = list.slice(i, i + 20);
      const det = await api({ action: "query", prop: "info", pageids: batch.map(x => x.pageid).join("|") });
      const pmap = det.query.pages || {};
      batch.forEach(rc => {
        const pg = pmap[rc.pageid] || {};
        pages.push({ rc, size: pg.length || rc.newlen || 0 });
      });
    }
    st.textContent = pages.length + " new pages loaded.";
    render();
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function render() {
  const res = document.getElementById("results");
  const hide = document.getElementById("hidePatrolled").checked;
  const arr = pages.filter(p => !hide || !localStorage.getItem(patrolledKey(p.rc.pageid)));
  res.innerHTML = arr.map(p => {
    const rc = p.rc;
    const isP = !!localStorage.getItem(patrolledKey(rc.pageid));
    const flags = [];
    if (p.size < 500) flags.push({ t: "Very short", c: "b-danger" });
    else if (p.size < 1500) flags.push({ t: "Short", c: "b-warn" });
    const link = "https://en.bharatpedia.org/wiki/" + encodeURIComponent(rc.title.replace(/ /g, "_"));
    return `<div class="page${isP ? " patrolled" : ""}"><div class="t"><a href="${link}" target="_blank" rel="noopener">${esc(rc.title)}</a>${flags.map(f => `<span class="badge ${f.c}">${f.t}</span>`).join("")}${isP ? '<span class="badge b-ok">Patrolled</span>' : ""}</div><div class="meta">${esc(rc.user)} &middot; ${fmtTime(rc.timestamp)} &middot; ${fmtSize(p.size)}</div><div class="patrol"><label><input type="checkbox" ${isP ? "checked" : ""} onchange="togglePatrol(${rc.pageid}, this.checked)" /> Mark patrolled</label></div></div>`;
  }).join("") || "<p>All caught up.</p>";
}
function togglePatrol(id, on) {
  if (on) localStorage.setItem(patrolledKey(id), "1"); else localStorage.removeItem(patrolledKey(id));
  render();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtSize(n) { return n >= 1024 ? (n/1024).toFixed(1) + " KB" : n + " bytes"; }
function fmtTime(s) { return new Date(s).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
document.getElementById("hidePatrolled").addEventListener("change", render);
</script>
</body>
</html>
