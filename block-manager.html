<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Block Manager - Bharatpedia Admin Tools</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6;
  --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f;
  --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff;
  --danger: #b3261e; --danger-soft: #fbe7e5;
  --warn: #9a6a00; --warn-soft: #fbf0cd;
  --ok: #1e7a3c; --ok-soft: #e2f3e6;
  --info: #1a5fb4; --info-soft: #e3eefb;
  --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --surface: #1d222a; --surface-2: #262c36;
    --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c;
    --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408;
    --danger: #f0837c; --danger-soft: #3d1f1d;
    --warn: #e0b95c; --warn-soft: #3a3013;
    --ok: #5cc47c; --ok-soft: #1d3626;
    --info: #7aa5ff; --info-soft: #1d2a40;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], select { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
input[type=text] { flex: 1; min-width: 200px; }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--ink-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-soft); font-weight: 600; font-size: 13px; white-space: nowrap; }
td.reason { max-width: 280px; word-wrap: break-word; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-inf { background: var(--danger-soft); color: var(--danger); }
.b-soon { background: var(--warn-soft); color: var(--warn); }
.b-temp { background: var(--info-soft); color: var(--info); }
.actions { white-space: nowrap; }
.actions a { margin-right: 8px; font-size: 13px; }
.empty { text-align: center; padding: 32px 16px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Block Manager</h1>
<p class="sub">View all active blocks on Bharatpedia. Use the Unblock links to manage blocks on-wiki where you are signed in as an administrator.</p>
<div class="controls">
<input type="text" id="q" placeholder="Filter by username or reason" oninput="render()" />
<select id="sort" onchange="render()">
<option value="new">Newest first</option>
<option value="old">Oldest first</option>
<option value="expiry">Expiring first</option>
</select>
<button id="refresh" onclick="load()">Refresh</button>
</div>
<div class="status" id="status"></div>
<div class="stat-grid" id="stats" style="display:none"></div>
<div class="card">
<div class="table-wrap">
<table id="tbl" style="display:none">
<thead><tr><th>Username</th><th>Blocked by</th><th>Block date</th><th>Expiry</th><th>Reason</th><th>Actions</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" style="display:none">No blocks match the current filter.</div>
</div>
</div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
const WIKI = "https://en.bharatpedia.org/wiki/";
let blocks = [];

async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url);
  if (!r.ok) throw new Error("API request failed (HTTP " + r.status + ")");
  return r.json();
}

async function load() {
  const st = document.getElementById("status");
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  document.getElementById("stats").style.display = "none";
  document.getElementById("tbl").style.display = "none";
  document.getElementById("empty").style.display = "none";
  st.textContent = "Loading blocks...";
  try {
    blocks = [];
    let bkcontinue = null;
    do {
      const p = { action: "query", list: "blocks", bklimit: 500, bkprop: "user|by|timestamp|expiry|reason|restrictions" };
      if (bkcontinue) p.bkcontinue = bkcontinue;
      const d = await api(p);
      (d.query.blocks || []).forEach(b => blocks.push(b));
      bkcontinue = d.continue && d.continue.bkcontinue;
      st.textContent = "Loaded " + blocks.length + " blocks...";
    } while (bkcontinue);
    st.textContent = blocks.length + " active blocks.";
    render();
  } catch (e) {
    st.textContent = "Error: " + e.message;
    const em = document.getElementById("empty");
    em.textContent = "Could not load blocks. " + e.message;
    em.style.display = "";
  }
  btn.disabled = false;
}

function isInfinite(b) {
  return b.expiry === "infinite" || b.expiry === "indefinite";
}

function expiryMs(b) {
  if (isInfinite(b)) return Infinity;
  const t = Date.parse(b.expiry);
  return isNaN(t) ? Infinity : t;
}

function expiringSoon(b) {
  const ms = expiryMs(b);
  if (!isFinite(ms)) return false;
  return ms - Date.now() < 7 * 86400000;
}

function fmtDate(s) {
  if (!s) return "-";
  const d = new Date(s);
  if (isNaN(d)) return esc(s);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

function expiryCell(b) {
  if (isInfinite(b)) return '<span class="badge b-inf">Infinite</span>';
  let html = esc(fmtDate(b.expiry));
  if (expiringSoon(b)) html += ' <span class="badge b-soon">Expiring soon</span>';
  else html += ' <span class="badge b-temp">Temporary</span>';
  return html;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let list = blocks.slice();
  if (q) list = list.filter(b =>
    (b.user || "").toLowerCase().includes(q) ||
    (b.reason || "").toLowerCase().includes(q)
  );
  if (sort === "new") list.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  else if (sort === "old") list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  else list.sort((a, b) => expiryMs(a) - expiryMs(b));

  const inf = blocks.filter(isInfinite).length;
  const temp = blocks.length - inf;
  const soon = blocks.filter(expiringSoon).length;
  const stats = document.getElementById("stats");
  stats.style.display = "";
  stats.innerHTML =
    stat(blocks.length, "Total active blocks") +
    stat(inf, "Infinite blocks") +
    stat(temp, "Temporary blocks") +
    stat(soon, "Expiring in 7 days");

  const tbl = document.getElementById("tbl");
  const empty = document.getElementById("empty");
  const rows = document.getElementById("rows");
  if (!list.length) {
    tbl.style.display = "none";
    empty.style.display = "";
    return;
  }
  tbl.style.display = "";
  empty.style.display = "none";
  rows.innerHTML = list.map(b => {
    const u = b.user || "";
    const up = encodeURIComponent(u.replace(/ /g, "_"));
    return "<tr>" +
      '<td><a href="' + WIKI + "User:" + up + '" target="_blank" rel="noopener">' + esc(u) + "</a></td>" +
      "<td>" + esc(b.by || "-") + "</td>" +
      "<td>" + esc(fmtDate(b.timestamp)) + "</td>" +
      "<td>" + expiryCell(b) + "</td>" +
      '<td class="reason">' + esc(b.reason || "-") + "</td>" +
      '<td class="actions">' +
        '<a href="' + WIKI + "Special:Unblock/" + up + '" target="_blank" rel="noopener">Unblock</a>' +
        '<a href="' + WIKI + "Special:Contributions/" + up + '" target="_blank" rel="noopener">Contribs</a>' +
      "</td></tr>";
  }).join("");
}

function stat(n, label) {
  return '<div class="stat"><b>' + n + "</b><span>" + esc(label) + "</span></div>";
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") render(); });
load();
</script>
</body>
</html>
