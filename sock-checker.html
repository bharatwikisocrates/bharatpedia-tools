<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Account Overlap Analyzer - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --ok: #1e7a3c; --ok-soft: #e2f3e6; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --ok: #5cc47c; --ok-soft: #1d3626; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 8px; }
.disclaimer { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 180px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 12px; font-size: 18px; }
.score-wrap { text-align: center; padding: 10px 0; }
.score { font-size: 52px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score-lbl { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.b-high { background: var(--danger-soft); color: var(--danger); }
.b-med { background: var(--warn-soft); color: var(--warn); }
.b-low { background: var(--ok-soft); color: var(--ok); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-soft); font-size: 13px; }
.hours { display: flex; align-items: flex-end; gap: 2px; height: 90px; margin-top: 8px; }
.hours .h { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hours .bar { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
.hours .bar.b { background: var(--ink-faint); }
.hours .t { font-size: 9px; color: var(--ink-faint); }
.legend { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Account Overlap Analyzer</h1>
<p class="sub">Compare the public edit patterns of two accounts side by side.</p>
<div class="disclaimer">This tool presents public contribution data only. Overlapping edits do not prove any relationship between accounts. Any conclusion requires human admin review.</div>
<div class="controls">
<input type="text" id="u1" placeholder="First username" />
<input type="text" id="u2" placeholder="Second username" />
<button id="go" onclick="compare()">Compare</button>
</div>
<div class="status" id="status"></div>
<div id="out"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
async function getContribs(user, st, tag) {
  let uccontinue = null; const list = [];
  do {
    const p = { action: "query", list: "usercontribs", ucuser: user, ucprop: "title|timestamp|comment", uclimit: 200, ucdir: "older" };
    if (uccontinue) p.uccontinue = uccontinue;
    const d = await api(p);
    (d.query.usercontribs || []).forEach(c => list.push(c));
    uccontinue = d.continue && d.continue.uccontinue;
    st.textContent = tag + ": fetched " + list.length + " edits...";
  } while (uccontinue && list.length < 400);
  return list;
}
async function getInfo(user) {
  const d = await api({ action: "query", list: "users", ususers: user, usprop: "editcount|registration" });
  return (d.query.users || [])[0] || {};
}
function hourDist(contribs) {
  const h = new Array(24).fill(0);
  contribs.forEach(c => { const d = new Date(c.timestamp); h[d.getUTCHours()]++; });
  return h;
}
function summaryStyle(contribs) {
  const withSummary = contribs.filter(c => c.comment && c.comment.trim().length > 0).length;
  return contribs.length ? withSummary / contribs.length : 0;
}
async function compare() {
  const u1 = document.getElementById("u1").value.trim(), u2 = document.getElementById("u2").value.trim();
  if (!u1 || !u2) return;
  const btn = document.getElementById("go"), st = document.getElementById("status"), out = document.getElementById("out");
  btn.disabled = true; out.innerHTML = "";
  try {
    const [i1, i2] = await Promise.all([getInfo(u1), getInfo(u2)]);
    if (i1.missing !== undefined || i2.missing !== undefined) { st.textContent = "One or both users were not found."; btn.disabled = false; return; }
    const c1 = await getContribs(u1, st, u1);
    const c2 = await getContribs(u2, st, u2);
    const set1 = new Set(c1.map(c => c.title)), set2 = new Set(c2.map(c => c.title));
    const shared = [...set1].filter(t => set2.has(t));
    const sharedDetail = shared.map(t => {
      const n1 = c1.filter(c => c.title === t).length, n2 = c2.filter(c => c.title === t).length;
      return { title: t, n1, n2 };
    }).sort((a, b) => (b.n1 + b.n2) - (a.n1 + a.n2)).slice(0, 30);
    const h1 = hourDist(c1), h2 = hourDist(c2);
    let hourOverlap = 0;
    for (let h = 0; h < 24; h++) if (h1[h] > 0 && h2[h] > 0) hourOverlap++;
    const s1 = summaryStyle(c1), s2 = summaryStyle(c2);
    const summaryDiff = Math.abs(s1 - s2);
    const smaller = Math.min(set1.size, set2.size) || 1;
    const pageOverlapPct = shared.length / smaller;
    let score = 0;
    score += Math.min(50, pageOverlapPct * 70);
    score += Math.min(25, hourOverlap / 24 * 40);
    score += Math.max(0, 15 - summaryDiff * 30);
    const reg1 = i1.registration ? new Date(i1.registration) : null, reg2 = i2.registration ? new Date(i2.registration) : null;
    let regNote = "unknown";
    if (reg1 && reg2) {
      const diffDays = Math.abs(reg1 - reg2) / 86400000;
      regNote = diffDays < 2 ? "created within 2 days of each other" : diffDays < 30 ? "created " + Math.round(diffDays) + " days apart" : "created " + Math.round(diffDays / 30) + " months apart";
      if (diffDays < 7) score += 10;
    }
    score = Math.min(100, Math.round(score));
    const lvl = score >= 60 ? "high" : score >= 30 ? "med" : "low";
    const lbl = score >= 60 ? "High overlap" : score >= 30 ? "Moderate overlap" : "Low overlap";
    const maxH = Math.max(1, ...h1, ...h2);
    const hourBars = h => { let s = ""; for (let i = 0; i < 24; i++) s += `<div class="h"><div class="bar${h === "b" ? " b" : ""}" style="height:${Math.round(h1[i] / maxH * 70)}px"></div><div class="t">${i}</div></div>`; return s; };
    st.textContent = "";
    out.innerHTML = `
    <div class="card"><div class="score-wrap"><div class="score">${score}</div><div class="score-lbl">Overlap score (0-100) &middot; <span class="badge b-${lvl}">${lbl}</span></div></div>
    <div class="stat-grid">
      <div class="stat"><b>${shared.length}</b><span>Shared pages</span></div>
      <div class="stat"><b>${set1.size} / ${set2.size}</b><span>Unique pages each</span></div>
      <div class="stat"><b>${hourOverlap}/24</b><span>Shared active hours (UTC)</span></div>
      <div class="stat"><b>${Math.round(s1*100)}% / ${Math.round(s2*100)}%</b><span>Edits with summary</span></div>
      <div class="stat"><b>${(i1.editcount||0).toLocaleString()} / ${(i2.editcount||0).toLocaleString()}</b><span>Total edits</span></div>
      <div class="stat"><b style="font-size:14px">${esc(regNote)}</b><span>Registration gap</span></div>
    </div></div>
    <div class="card"><h2>Active hours (UTC)</h2><div class="hours">${hourBars("a")}</div><div class="legend"><i style="background:var(--accent)"></i>${esc(u1)} &nbsp; <i style="background:var(--ink-faint)"></i>${esc(u2)} (overlaid scale)</div></div>
    <div class="card"><h2>Shared pages (${sharedDetail.length} shown)</h2>${sharedDetail.length ? `<table><tr><th>Page</th><th>${esc(u1)}</th><th>${esc(u2)}</th></tr>${sharedDetail.map(s => `<tr><td><a href="https://en.bharatpedia.org/wiki/${encodeURIComponent(s.title.replace(/ /g, "_"))}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${s.n1}</td><td>${s.n2}</td></tr>`).join("")}</table>` : "<p>No shared pages in the sampled edits.</p>"}</div>`;
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
</script>
</body>
</html>
