<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>AfC Review History - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --accent-soft: #fbeedd; --danger: #b3261e; --danger-soft: #fbe7e5; --ok: #1e7a3c; --ok-soft: #e2f3e6; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --accent-soft: #3a2a16; --danger: #f0837c; --danger-soft: #3d1f1d; --ok: #5cc47c; --ok-soft: #1d3626; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 12px; font-size: 18px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 6px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--ink-soft); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.b-acc { background: var(--ok-soft); color: var(--ok); }
.b-dec { background: var(--danger-soft); color: var(--danger); }
.b-com { background: var(--accent-soft); color: var(--accent); }
.b-oth { background: var(--surface-2); color: var(--ink-soft); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-soft); font-weight: 600; font-size: 13px; }
.note { font-size: 13px; color: var(--ink-soft); }
.pager { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pager button { padding: 6px 12px; font-size: 14px; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>AfC Review History</h1>
<p class="sub">Reviews carried out by an Articles for creation reviewer: drafts they accepted, declined, or commented on.</p>
<div class="controls">
<input type="text" id="user" placeholder="Enter username" />
<button id="go" onclick="run()">Show review history</button>
</div>
<div class="status" id="status"></div>
<div id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
const WIKI = "https://en.bharatpedia.org/wiki/";
const MAX_DRAFT_EDITS = 500;
const REV_FETCH_CAP = 250;
const state = { user: null, rows: [], page: 0, size: 100, truncated: false, scanned: 0 };
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtTime(s) { return new Date(s).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
function pageUrl(title) { return WIKI + encodeURIComponent(title.replace(/ /g, "_")); }
function classifyByComment(c) {
  const cm = c.comment || "";
  const low = cm.toLowerCase();
  const mv = cm.match(/moved page \[\[(Draft:[^\]]+)\]\] to \[\[([^\]]+)\]\]/i);
  if (mv && mv[2].indexOf("Draft:") !== 0) return "Accepted";
  if (/declin/.test(low)) return "Declined";
  if (/accept/.test(low)) return "Accepted";
  if (/afc review:\s*comment|commenting on (the )?submission|afc comment/.test(low)) return "Commented";
  return null;
}
function statusFromText(txt) {
  if (!txt) return null;
  const m = txt.match(/\{\{\s*AfC submission\s*\|\s*([a-zA-Z])/);
  if (!m) return "none";
  const letter = m[1].toLowerCase();
  if (letter === "d") return "Declined";
  if (letter === "c") return "Commented";
  return "Other";
}
async function run() {
  const user = document.getElementById("user").value.trim();
  if (!user) return;
  const btn = document.getElementById("go"), st = document.getElementById("status");
  const res = document.getElementById("results");
  btn.disabled = true;
  res.innerHTML = "";
  state.rows = []; state.page = 0; state.truncated = false; state.scanned = 0;
  st.textContent = "Fetching user info...";
  try {
    const u = await api({ action: "query", list: "users", ususers: user, usprop: "editcount|registration" });
    const info = (u.query.users || [])[0];
    if (!info || info.missing !== undefined) { st.textContent = "User not found."; btn.disabled = false; return; }
    state.user = user;
    st.textContent = "Fetching draft edits...";
    const contribs = [];
    let cont = null;
    while (contribs.length < MAX_DRAFT_EDITS) {
      const p = { action: "query", list: "usercontribs", ucuser: user, ucnamespace: 118, ucprop: "title|timestamp|comment|ids", uclimit: 500, ucdir: "older" };
      if (cont) p.uccontinue = cont;
      const d = await api(p);
      (d.query.usercontribs || []).forEach(c => contribs.push(c));
      cont = (d.continue && d.continue.uccontinue) || null;
      if (!cont) break;
      await new Promise(r => setTimeout(r, 300));
    }
    if (contribs.length >= MAX_DRAFT_EDITS && cont) state.truncated = true;
    state.scanned = contribs.length;
    const rows = contribs.map(c => ({ title: c.title, timestamp: c.timestamp, revid: c.revid, action: classifyByComment(c) }));
    const unsettled = rows.filter(r => !r.action);
    const toFetch = unsettled.slice(0, REV_FETCH_CAP);
    if (toFetch.length) {
      st.textContent = "Checking submission status for " + toFetch.length + " edits, please wait...";
      const revText = {};
      for (let i = 0; i < toFetch.length; i += 50) {
        const batch = toFetch.slice(i, i + 50);
        const d = await api({ action: "query", prop: "revisions", revids: batch.map(r => r.revid).join("|"), rvprop: "content" });
        const pages = (d.query && d.query.pages) || {};
        Object.keys(pages).forEach(id => {
          const rev = (pages[id].revisions || [])[0];
          if (rev) revText[rev.revid] = rev["*"] || "";
        });
        if (i + 50 < toFetch.length) await new Promise(r => setTimeout(r, 300));
      }
      const noTemplate = [];
      toFetch.forEach(r => {
        const s = statusFromText(revText[r.revid]);
        if (s === "Declined" || s === "Commented" || s === "Other") r.action = s;
        else if (s === "none") noTemplate.push(r);
        else r.action = "Other";
      });
      if (noTemplate.length) {
        const titles = [...new Set(noTemplate.map(r => r.title))];
        const exists = {};
        for (let i = 0; i < titles.length; i += 50) {
          const batch = titles.slice(i, i + 50);
          const d = await api({ action: "query", titles: batch.join("|"), prop: "info" });
          const pages = (d.query && d.query.pages) || {};
          Object.keys(pages).forEach(id => { exists[pages[id].title] = pages[id].missing === undefined; });
          if (i + 50 < titles.length) await new Promise(r => setTimeout(r, 300));
        }
        const acceptedGiven = {};
        noTemplate.forEach(r => {
          if (exists[r.title] === false && !acceptedGiven[r.title]) { r.action = "Accepted"; acceptedGiven[r.title] = true; }
          else r.action = "Other";
        });
      }
    }
    unsettled.slice(REV_FETCH_CAP).forEach(r => { r.action = "Other"; });
    state.rows = rows;
    st.textContent = "";
    renderResults();
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function badge(action) {
  const cls = action === "Accepted" ? "b-acc" : action === "Declined" ? "b-dec" : action === "Commented" ? "b-com" : "b-oth";
  return '<span class="badge ' + cls + '">' + action + '</span>';
}
function renderResults() {
  const res = document.getElementById("results");
  const rows = state.rows;
  const counts = { Accepted: 0, Declined: 0, Commented: 0, Other: 0 };
  rows.forEach(r => { counts[r.action] = (counts[r.action] || 0) + 1; });
  res.innerHTML =
  '<div class="card"><h2>Reviews by ' + esc(state.user) + '</h2>' +
  '<div class="stat-grid">' +
  '<div class="stat"><b>' + counts.Accepted.toLocaleString() + '</b><span>Accepted</span></div>' +
  '<div class="stat"><b>' + counts.Declined.toLocaleString() + '</b><span>Declined</span></div>' +
  '<div class="stat"><b>' + counts.Commented.toLocaleString() + '</b><span>Commented</span></div>' +
  '<div class="stat"><b>' + counts.Other.toLocaleString() + '</b><span>Other draft edits</span></div>' +
  '<div class="stat"><b>' + state.scanned.toLocaleString() + '</b><span>Draft edits scanned</span></div>' +
  '</div>' +
  '<p class="note" style="margin:10px 0 0">Compiled from the reviewer\'s edits to drafts carrying an AfC submission template.' +
  (state.truncated ? ' This user has more than ' + MAX_DRAFT_EDITS + ' draft edits; only the first ' + MAX_DRAFT_EDITS + ' (most recent) were processed.' : '') +
  ' An "Accepted" row where the draft title is gone means the submission was moved out of the Draft namespace.</p></div>' +
  (rows.length ?
  '<div class="card"><h2>History (' + rows.length.toLocaleString() + ' edits)</h2>' +
  '<div style="margin-bottom:8px"><label style="font-size:13px">Show: </label><select id="pgSize" onchange="sizeChange()"><option value="100">100</option><option value="500">500</option><option value="1000">1000</option></select> per page</div>' +
  '<div id="pgTable"></div><div class="pager" id="pgNav"></div></div>' : '');
  if (rows.length) { document.getElementById("pgSize").value = String(state.size); renderTable(); }
}
function renderTable() {
  const rows = state.rows, total = rows.length;
  const pages = Math.max(1, Math.ceil(total / state.size));
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  const start = state.page * state.size;
  const slice = rows.slice(start, start + state.size);
  document.getElementById("pgTable").innerHTML =
    '<table><tr><th>Draft</th><th>Date</th><th>Action</th><th>Diff</th></tr>' +
    slice.map(r => '<tr><td><a href="' + pageUrl(r.title) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a></td><td>' + fmtTime(r.timestamp) + '</td><td>' + badge(r.action) + '</td><td><a href="' + WIKI + 'Special:Diff/' + r.revid + '" target="_blank" rel="noopener">diff</a></td></tr>').join("") +
    '</table>';
  document.getElementById("pgNav").innerHTML =
    '<button onclick="goPage(-1)" ' + (state.page <= 0 ? 'disabled' : '') + '>Previous</button>' +
    '<span class="note">Page ' + (state.page + 1) + ' of ' + pages + ' (' + (start + 1) + '-' + Math.min(start + state.size, total) + ' of ' + total.toLocaleString() + ')</span>' +
    '<button onclick="goPage(1)" ' + (state.page >= pages - 1 ? 'disabled' : '') + '>Next</button>';
}
function goPage(d) { state.page += d; renderTable(); }
function sizeChange() { state.size = parseInt(document.getElementById("pgSize").value, 10); state.page = 0; renderTable(); }
document.getElementById("user").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
(function () {
  const q = new URLSearchParams(location.search);
  const u = (q.get("user") || q.get("username") || "").trim();
  if (u) { document.getElementById("user").value = u; run(); }
})();
</script>
</body>
</html>
