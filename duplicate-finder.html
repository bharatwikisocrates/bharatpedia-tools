<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Duplicate Finder - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --ok: #1e7a3c; --ok-soft: #e2f3e6; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --ok: #5cc47c; --ok-soft: #1d3626; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.results { display: grid; gap: 12px; }
.pair { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.pair .titles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.pair .vs { color: var(--ink-faint); font-weight: 400; font-size: 13px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.b-high { background: var(--danger-soft); color: var(--danger); }
.b-med { background: var(--warn-soft); color: var(--warn); }
.b-low { background: var(--ok-soft); color: var(--ok); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Duplicate Finder</h1>
<p class="sub">Search for articles with similar titles. Review pairs that may be duplicates or merge candidates.</p>
<div class="controls">
<input type="text" id="q" placeholder="Enter a topic, e.g. metro station" />
<button id="go" onclick="search()">Search</button>
</div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url);
  return r.json();
}
function similarity(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const longer = a.length > b.length ? a : b, shorter = a.length > b.length ? b : a;
  if (!longer.length) return 1;
  const dist = levenshtein(longer, shorter);
  return (longer.length - dist) / longer.length;
}
function levenshtein(a, b) {
  const m = []; for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++) for (let j = 1; j <= a.length; j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (b[i-1] === a[j-1] ? 0 : 1));
  return m[b.length][a.length];
}
async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const btn = document.getElementById("go"), st = document.getElementById("status"), res = document.getElementById("results");
  btn.disabled = true; st.textContent = "Searching..."; res.innerHTML = "";
  try {
    const data = await api({ action: "query", list: "search", srsearch: q, srnamespace: 0, srlimit: 30, srprop: "size|wordcount|timestamp" });
    const hits = (data.query && data.query.search) || [];
    st.textContent = hits.length + " articles found. Comparing title similarity...";
    const pairs = [];
    for (let i = 0; i < hits.length; i++) for (let j = i+1; j < hits.length; j++) {
      const sim = similarity(hits[i].title, hits[j].title);
      if (sim >= 0.4) pairs.push({ a: hits[i], b: hits[j], sim });
    }
    pairs.sort((x, y) => y.sim - x.sim);
    if (!pairs.length) { st.textContent = "No similar title pairs found."; }
    else {
      st.textContent = pairs.length + " similar pairs found.";
      res.innerHTML = pairs.map(p => {
        const pct = Math.round(p.sim * 100);
        const cls = pct >= 75 ? "b-high" : pct >= 55 ? "b-med" : "b-low";
        const label = pct >= 75 ? "High similarity" : pct >= 55 ? "Medium similarity" : "Low similarity";
        const link = t => "https://en.bharatpedia.org/wiki/" + encodeURIComponent(t.replace(/ /g, "_"));
        return `<div class="pair"><div class="titles"><a href="${link(p.a.title)}" target="_blank" rel="noopener">${esc(p.a.title)}</a><span class="vs">vs</span><a href="${link(p.b.title)}" target="_blank" rel="noopener">${esc(p.b.title)}</a><span class="badge ${cls}">${label} (${pct}%)</span></div><div class="meta">Sizes: ${fmtSize(p.a.size)} / ${fmtSize(p.b.size)}</div></div>`;
      }).join("");
    }
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function fmtSize(n) { return n >= 1024 ? (n/1024).toFixed(1) + " KB" : n + " B"; }
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
