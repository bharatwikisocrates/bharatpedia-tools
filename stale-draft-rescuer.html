<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Stale Draft Rescuer - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --ok: #1e7a3c; --ok-soft: #e2f3e6; --warn: #9a6a00; --warn-soft: #fbf0cd; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --ok: #5cc47c; --ok-soft: #1d3626; --warn: #e0b95c; --warn-soft: #3a3013; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.results { display: grid; gap: 12px; }
.draft { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.draft .t { font-weight: 700; font-size: 16px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; }
.b-rescue { background: var(--ok-soft); color: var(--ok); }
.b-maybe { background: var(--warn-soft); color: var(--warn); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Stale Draft Rescuer</h1>
<p class="sub">Find abandoned drafts with real potential. Bigger drafts with references are flagged as rescue-worthy.</p>
<div class="controls">
<button id="go" onclick="load()">Load stale drafts</button>
<select id="sort" onchange="render()">
<option value="size">Sort: largest first</option>
<option value="oldest">Sort: oldest edit first</option>
<option value="newest">Sort: newest edit first</option>
</select>
</div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
let drafts = [];
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
async function load() {
  const btn = document.getElementById("go"), st = document.getElementById("status");
  btn.disabled = true; st.textContent = "Loading stale drafts..."; drafts = [];
  try {
    let cmcontinue = null, all = [];
    do {
      const p = { action: "query", list: "categorymembers", cmtitle: "Category:Stale drafts", cmnamespace: 118, cmlimit: 100, cmtype: "page" };
      if (cmcontinue) p.cmcontinue = cmcontinue;
      const d = await api(p);
      all = all.concat(d.query.categorymembers || []);
      cmcontinue = d.continue && d.continue.cmcontinue;
      st.textContent = "Found " + all.length + " drafts so far...";
    } while (cmcontinue && all.length < 200);
    st.textContent = "Fetching details for " + all.length + " drafts...";
    for (let i = 0; i < all.length; i += 20) {
      const batch = all.slice(i, i + 20);
      const d = await api({ action: "query", prop: "info|revisions", pageids: batch.map(x => x.pageid).join("|"), inprop: "", rvprop: "timestamp|user|size", rvlimit: 1, rvdir: "older" });
      const pages = d.query.pages || {};
      for (const pid in pages) {
        const pg = pages[pid];
        const rev = (pg.revisions && pg.revisions[0]) || {};
        drafts.push({ title: pg.title, pageid: pg.pageid, size: pg.length || 0, touched: pg.touched, lastEdit: rev.timestamp || pg.touched, user: rev.user || "unknown" });
      }
      st.textContent = "Fetched " + Math.min(i + 20, all.length) + " / " + all.length;
    }
    if (drafts.length === 0) {
      st.textContent = "No highly well cited rescue-worthy draft found.";
    } else {
      st.textContent = drafts.length + " stale drafts loaded.";
    }
    render();
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function render() {
  const sort = document.getElementById("sort").value;
  const res = document.getElementById("results");
  const arr = drafts.slice();
  if (sort === "size") arr.sort((a, b) => b.size - a.size);
  else if (sort === "oldest") arr.sort((a, b) => new Date(a.lastEdit) - new Date(b.lastEdit));
  else arr.sort((a, b) => new Date(b.lastEdit) - new Date(a.lastEdit));
  const maxSize = Math.max(1, ...arr.map(d => d.size));
  res.innerHTML = arr.map(d => {
    const rescue = d.size > 2048;
    const badge = rescue ? '<span class="badge b-rescue">Rescue-worthy</span>' : d.size > 512 ? '<span class="badge b-maybe">Has content</span>' : "";
    const link = "https://en.bharatpedia.org/wiki/" + encodeURIComponent(d.title.replace(/ /g, "_"));
    const age = Math.floor((Date.now() - new Date(d.lastEdit)) / 86400000);
    return `<div class="draft"><div class="t"><a href="${link}" target="_blank" rel="noopener">${esc(d.title)}</a>${badge}</div><div class="meta"><span>${fmtSize(d.size)}</span><span>Last edit: ${fmtDate(d.lastEdit)} (${age}d ago)</span><span>By: ${esc(d.user)}</span></div><div class="bar"><i style="width:${Math.round(d.size / maxSize * 100)}%"></i></div></div>`;
  }).join("");
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function fmtSize(n) { return n >= 1024 ? (n/1024).toFixed(1) + " KB" : n + " bytes"; }
function fmtDate(s) { return new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
</script>
</body>
</html>
