<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Vandalism Radar - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --ok: #1e7a3c; --ok-soft: #e2f3e6; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --ok: #5cc47c; --ok-soft: #1d3626; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; }
select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.results { display: grid; gap: 10px; }
.edit { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow); }
.edit.r-high { border-left-color: var(--danger); }
.edit.r-med { border-left-color: var(--warn); }
.edit.r-low { border-left-color: var(--ok); }
.edit .t { font-weight: 700; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; }
.b-high { background: var(--danger-soft); color: var(--danger); }
.b-med { background: var(--warn-soft); color: var(--warn); }
.b-low { background: var(--ok-soft); color: var(--ok); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.flags { font-size: 13px; margin-top: 6px; color: var(--ink-soft); }
.flags span { display: inline-block; background: var(--surface-2); border-radius: 4px; padding: 1px 8px; margin: 2px 4px 2px 0; }
.links { margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Vandalism Radar</h1>
<p class="sub">Recent edits scored by risk. High-risk edits deserve a closer look.</p>
<div class="controls">
<button id="go" onclick="load()">Scan recent changes</button>
<select id="limit"><option value="50">50 edits</option><option value="100" selected>100 edits</option><option value="250">250 edits</option></select>
<select id="filter"><option value="all">Show all</option><option value="high">High risk only</option><option value="med">Medium and high</option></select>
</div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
const SPAM_WORDS = ["viagra", "casino", "porn", "xxx", "loan", "crypto", "bitcoin", "forex", "escort", "seo service", "buy now", "cheap"];
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url); return r.json();
}
function scoreEdit(rc) {
  let score = 0; const flags = [];
  const delta = (rc.newlen || 0) - (rc.oldlen || 0);
  if (delta < -500) { score += 3; flags.push("Large deletion (" + Math.abs(delta) + " chars removed)"); }
  else if (delta < -200) { score += 1; flags.push("Moderate deletion"); }
  if (rc.comment && rc.comment.length > 3 && rc.comment === rc.comment.toUpperCase() && /[A-Z]{4,}/.test(rc.comment)) { score += 1; flags.push("ALL CAPS summary"); }
  const lowComment = (rc.comment || "").toLowerCase();
  for (const w of SPAM_WORDS) if (lowComment.includes(w)) { score += 3; flags.push("Spam keyword in summary: " + w); }
  if (rc.anon !== undefined || rc.user && rc.user.match(/^\d+\.\d+\.\d+\.\d+$/)) { score += 1; flags.push("IP / unregistered editor"); }
  if (rc.type === "new") { score += 0; flags.push("New page"); }
  if (!rc.comment) { score += 1; flags.push("No edit summary"); }
  return { score, flags, delta };
}
async function load() {
  const btn = document.getElementById("go"), st = document.getElementById("status"), res = document.getElementById("results");
  const limit = document.getElementById("limit").value, filter = document.getElementById("filter").value;
  btn.disabled = true; st.textContent = "Fetching recent changes..."; res.innerHTML = "";
  try {
    const d = await api({ action: "query", list: "recentchanges", rcprop: "title|user|timestamp|comment|sizes|flags", rctype: "edit|new", rcnamespace: 0, rclimit: limit, rcdir: "older" });
    const list = (d.query && d.query.recentchanges) || [];
    const scored = list.map(rc => Object.assign({ rc }, scoreEdit(rc)));
    scored.sort((a, b) => b.score - a.score);
    const shown = scored.filter(s => filter === "all" || (filter === "high" && s.score >= 3) || (filter === "med" && s.score >= 1));
    st.textContent = shown.length + " of " + list.length + " edits shown.";
    res.innerHTML = shown.map(s => {
      const rc = s.rc;
      const lvl = s.score >= 3 ? "high" : s.score >= 1 ? "med" : "low";
      const lbl = s.score >= 3 ? "High risk" : s.score >= 1 ? "Medium risk" : "Low risk";
      const diffUrl = "https://en.bharatpedia.org/w/index.php?title=" + encodeURIComponent(rc.title.replace(/ /g, "_")) + "&diff=" + rc.revid + "&oldid=" + rc.old_revid;
      const pageUrl = "https://en.bharatpedia.org/wiki/" + encodeURIComponent(rc.title.replace(/ /g, "_"));
      const dstr = s.delta >= 0 ? "+" + s.delta : s.delta;
      return `<div class="edit r-${lvl}"><div class="t"><a href="${pageUrl}" target="_blank" rel="noopener">${esc(rc.title)}</a><span class="badge b-${lvl}">${lbl} (${s.score})</span></div><div class="meta">${esc(rc.user)} &middot; ${fmtTime(rc.timestamp)} &middot; ${dstr} chars${rc.comment ? " &middot; &ldquo;" + esc(rc.comment) + "&rdquo;" : ""}</div>${s.flags.length ? `<div class="flags">${s.flags.map(f => "<span>" + esc(f) + "</span>").join("")}</div>` : ""}<div class="links"><a href="${diffUrl}" target="_blank" rel="noopener">View diff</a></div></div>`;
    }).join("") || "<p>No edits match this filter.</p>";
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtTime(s) { return new Date(s).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
</script>
</body>
</html>
