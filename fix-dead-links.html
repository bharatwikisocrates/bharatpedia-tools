<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Fix Dead Links - Bharatpedia Admin Tools</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f0; --surface: #fff; --surface-2: #f0ede6; --ink: #1c2430; --ink-soft: #4c5866; --ink-faint: #77828f; --line: #ddd8cc; --accent: #b3540a; --accent-ink: #fff; --ok: #1e7a3c; --ok-soft: #e2f3e6; --warn: #9a6a00; --warn-soft: #fbf0cd; --danger: #b3261e; --danger-soft: #fbe7e5; --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.05); }
@media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1d222a; --surface-2: #262c36; --ink: #e8ebef; --ink-soft: #b3bcc7; --ink-faint: #828e9c; --line: #343c48; --accent: #e08a3c; --accent-ink: #1c1408; --ok: #5cc47c; --ok-soft: #1d3626; --warn: #e0b95c; --warn-soft: #3a3013; --danger: #f0837c; --danger-soft: #3d1f1d; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
.back { display: inline-block; margin-bottom: 16px; font-size: 14px; text-decoration: none; }
h1 { font-family: Georgia, serif; font-size: clamp(24px, 4vw, 32px); margin: 0 0 8px; }
.sub { color: var(--ink-soft); margin: 0 0 20px; }
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text] { flex: 1 1 220px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); color: var(--ink); }
button { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.status { margin: 12px 0; color: var(--ink-soft); font-size: 14px; }
.results { display: grid; gap: 10px; }
.link { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow); }
.link.ok { border-left-color: var(--ok); }
.link.dead { border-left-color: var(--danger); }
.link.unknown { border-left-color: var(--warn); }
.link .u { font-weight: 600; word-break: break-all; font-size: 14px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; white-space: nowrap; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-dead { background: var(--danger-soft); color: var(--danger); }
.b-unknown { background: var(--warn-soft); color: var(--warn); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.links { margin-top: 6px; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; font-size: 14px; }
.summary span { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; All tools</a>
<h1>Fix Dead Links</h1>
<p class="sub">Scan one page for external links, check which ones are dead, and get archived replacements.</p>
<div class="controls">
<input type="text" id="title" placeholder="Page title, e.g. Kanpur" />
<button id="go" onclick="scan()">Check all links</button>
</div>
<div class="status" id="status"></div>
<div class="summary" id="summary"></div>
<div class="results" id="results"></div>
</div>
<script>
const API = "https://en.bharatpedia.org/w/api.php";
async function api(params) {
  const url = API + "?" + new URLSearchParams(Object.assign({ format: "json", origin: "*" }, params));
  const r = await fetch(url);
  if (!r.ok) throw new Error("API error " + r.status);
  return r.json();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function extractUrls(wikitext) {
  const found = new Map();
  const add = (url, ctx) => {
    url = url.replace(/[)\].,;'"]+$/, "");
    if (!/^https?:\/\//i.test(url)) return;
    if (/bharatpedia\.org/i.test(url)) return;
    if (!found.has(url)) found.set(url, ctx);
  };
  const refRe = /<ref[^>]*>([\s\S]*?)<\/ref\s*>/gi;
  let m;
  while ((m = refRe.exec(wikitext)) !== null) {
    const body = m[1];
    const urlRe = /https?:\/\/[^\s<>\[\]{}|"]+/gi;
    let u;
    while ((u = urlRe.exec(body)) !== null) add(u[0], "reference");
  }
  const linkRe = /\[https?:\/\/[^\s\]]+/gi;
  while ((m = linkRe.exec(wikitext)) !== null) add(m[0].slice(1), "external link");
  const bareRe = /(^|[\s(])https?:\/\/[^\s<>\[\]{}|")]+/gim;
  while ((m = bareRe.exec(wikitext)) !== null) add(m[0].trim(), "bare URL");
  return [...found.entries()].map(([url, ctx]) => ({ url, ctx }));
}
async function checkUrl(url) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url), { signal: ctrl.signal });
    clearTimeout(t);
    return r.ok ? "alive" : "dead";
  } catch (e) {
    return "unknown";
  }
}
function waybackUrl(url) {
  return "https://web.archive.org/web/2id_/" + url;
}
async function scan() {
  const title = document.getElementById("title").value.trim();
  const btn = document.getElementById("go"), st = document.getElementById("status"), res = document.getElementById("results"), sum = document.getElementById("summary");
  if (!title) { st.textContent = "Enter a page title first."; return; }
  btn.disabled = true; res.innerHTML = ""; sum.innerHTML = "";
  try {
    st.textContent = "Fetching page wikitext...";
    const d = await api({ action: "parse", page: title, prop: "wikitext" });
    if (d.error) { st.textContent = "Page not found: " + title; btn.disabled = false; return; }
    const wt = (d.parse && d.parse.wikitext && d.parse.wikitext["*"]) || "";
    const links = extractUrls(wt);
    if (!links.length) { st.textContent = "No external URLs found on this page."; btn.disabled = false; return; }
    st.textContent = "Found " + links.length + " URLs. Checking, please wait...";
    const results = [];
    for (let i = 0; i < links.length; i++) {
      st.textContent = "Checking link " + (i + 1) + " of " + links.length + ", please wait...";
      const status = await checkUrl(links[i].url);
      results.push(Object.assign({ status }, links[i]));
      if (i + 1 < links.length) await sleep(600);
    }
    const alive = results.filter(r => r.status === "alive").length;
    const dead = results.filter(r => r.status === "dead").length;
    const unknown = results.length - alive - dead;
    sum.innerHTML = "<span>" + results.length + " links checked</span><span>" + alive + " alive</span><span>" + dead + " dead</span><span>" + unknown + " unknown</span>";
    results.sort((a, b) => (a.status === "dead" ? 0 : 1) - (b.status === "dead" ? 0 : 1));
    res.innerHTML = results.map(r => {
      const cls = r.status === "alive" ? "ok" : r.status === "dead" ? "dead" : "unknown";
      const lbl = r.status === "alive" ? "Alive" : r.status === "dead" ? "Dead" : "Unknown";
      return '<div class="link ' + cls + '"><div class="u">' + esc(r.url) + '<span class="badge b-' + cls + '">' + lbl + '</span></div>' +
        '<div class="meta">Found in: ' + esc(r.ctx) + '</div>' +
        '<div class="links">' +
        (r.status !== "alive" ? '<a href="' + esc(waybackUrl(r.url)) + '" target="_blank" rel="noopener">View archived copy</a>' : "") +
        '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open link</a>' +
        '</div></div>';
    }).join("");
    st.textContent = "Done.";
  } catch (e) { st.textContent = "Error: " + e.message; }
  btn.disabled = false;
}
document.getElementById("title").addEventListener("keydown", e => { if (e.key === "Enter") scan(); });
</script>
</body>
</html>
